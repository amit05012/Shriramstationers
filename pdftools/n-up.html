<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional N-Up Merge | Shriram Stationers Dausa</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Poppins', sans-serif; scroll-behavior: smooth; background-color: #0f172a; color: #f8fafc; }
        
        .drop-zone { border: 2px dashed #334155; background: rgba(30, 41, 59, 0.5); transition: 0.3s; }
        .drop-zone.drag-over { border-color: #60a5fa; background: rgba(59, 130, 246, 0.1); }
        
        #fileList { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1.5rem; }
        .file-item { background: #1e293b; border: 1px solid #334155; transition: 0.3s; cursor: grab; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 1rem; border-radius: 1rem; }
        .file-item:hover { border-color: #3b82f6; background: #24344d; transform: translateY(-5px); }

        .thumb-box { width: 140px; height: 190px; background: #0f172a; border-radius: 8px; overflow: hidden; border: 2px solid #334155; flex-shrink: 0; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4); display: flex; align-items: center; justify-content: center; }
        .thumb-box canvas { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

    <nav class="bg-slate-900/95 backdrop-blur-md py-3 px-6 shadow-lg flex justify-between items-center sticky top-0 z-50 border-b border-slate-800">
        <div class="cursor-pointer flex items-center gap-3" onclick="window.location.href='https://www.shriramstationers.in'">
            <img src="../logo.jpg" alt="Logo" class="h-12 md:h-14 object-contain rounded-md border border-slate-700">
            <span class="text-2xl font-bold tracking-tight text-slate-100 uppercase">Shriram Stationers</span>
        </div>
        <div class="hidden md:flex space-x-8 font-semibold text-slate-300">
            <a href="https://www.shriramstationers.in" class="hover:text-white transition">Home</a>
            <a href="index.html" class="text-blue-400 border-b-2 border-blue-500 pb-1">PDF Tools</a>
        </div>
    </nav>

    <main class="flex-grow max-w-7xl mx-auto w-full px-6 py-12">
        <section id="resultHub" class="hidden mb-12 p-10 rounded-3xl bg-slate-800/60 border-2 border-blue-500/30 text-center animate-in fade-in">
            <h2 class="text-3xl font-extrabold text-white mb-4">Files Optimized!</h2>
            <div class="flex justify-center gap-4">
                <button onclick="previewPDF()" class="bg-slate-700 text-white px-8 py-4 rounded-xl font-bold hover:bg-slate-600 transition">Preview</button>
                <button onclick="downloadPDF()" class="bg-white text-slate-900 px-8 py-4 rounded-xl font-bold hover:bg-slate-200 transition">Download</button>
            </div>
            <button onclick="location.reload()" class="mt-8 text-xs text-slate-500 underline uppercase">Start New Batch</button>
        </section>

        <div id="toolInterface">
            <div class="grid lg:grid-cols-3 gap-8">
                <div class="lg:col-span-1 space-y-6">
                    <div class="bg-slate-800/40 rounded-3xl border border-slate-700 p-6 shadow-2xl">
                        <div id="dropZone" class="drop-zone rounded-2xl py-10 flex flex-col items-center justify-center cursor-pointer mb-6 text-center px-4">
                            <i class="fas fa-file-pdf text-4xl text-blue-500 mb-2"></i>
                            <p class="text-[10px] font-bold text-white uppercase tracking-widest leading-none">Select PDF Files</p>
                            <input type="file" id="fileInput" multiple accept="application/pdf" class="hidden">
                        </div>

                        <div class="space-y-4 mb-6">
                            <div>
                                <label class="text-[10px] font-bold text-slate-500 uppercase mb-2 block">Slides Per Side</label>
                                <select id="nupValue" class="w-full bg-slate-900 border border-slate-700 text-white p-3 rounded-xl font-bold text-sm outline-none">
                                    <option value="2">2 Slides</option>
                                    <option value="3">3 Slides</option>
                                    <option value="4" selected>4 Slides</option>
                                    <option value="6">6 Slides</option>
                                </select>
                            </div>
                            <label class="flex items-center justify-between p-3 bg-slate-900/40 rounded-xl border border-slate-700 cursor-pointer">
                                <span class="text-xs font-bold text-slate-300">Binding Margin (1cm)</span>
                                <input type="checkbox" id="marginFix" checked class="w-4 h-4 accent-blue-500">
                            </label>
                            <label class="flex items-center justify-between p-3 bg-slate-900/40 rounded-xl border border-slate-700 cursor-pointer">
                                <span class="text-xs font-bold text-slate-300">Balance Double-Sided</span>
                                <input type="checkbox" id="balanceFix" checked class="w-4 h-4 accent-blue-500">
                            </label>
                            <label class="flex items-center justify-between p-3 bg-slate-900/40 rounded-xl border border-slate-700 cursor-pointer">
                                <span class="text-xs font-bold text-slate-300">Add Page Numbers</span>
                                <input type="checkbox" id="pageNum" checked class="w-4 h-4 accent-blue-500">
                            </label>
                        </div>
                        <button onclick="processNUp()" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-5 rounded-2xl font-black text-xl shadow-lg transition transform active:scale-95">GENERATE PDF</button>
                    </div>
                </div>

                <div class="lg:col-span-2">
                    <div class="bg-slate-800/40 rounded-3xl border border-slate-700 p-8 min-h-[500px] shadow-2xl">
                        <div class="flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
                            <h3 class="text-white font-bold flex items-center gap-2">Sorting Grid</h3>
                            <button onclick="sortFilesByName()" class="text-[10px] bg-slate-700 text-white px-4 py-2 rounded-lg transition hover:bg-slate-600">Sort by Name</button>
                        </div>
                        <div id="fileList"></div>
                        <div id="emptyMsg" class="h-64 flex flex-col items-center justify-center text-slate-700 uppercase font-bold text-xs tracking-widest">No Files Uploaded</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="passwordModal" class="hidden fixed inset-0 bg-slate-950/95 backdrop-blur-md z-[200] flex items-center justify-center p-6">
        <div class="bg-slate-900 border border-slate-700 p-8 rounded-3xl max-w-sm w-full text-center shadow-2xl">
            <i class="fas fa-lock text-4xl text-red-500 mb-4"></i>
            <h3 class="text-xl font-bold text-white mb-2 uppercase">File Locked</h3>
            <p id="passwordFilename" class="text-[10px] text-slate-400 mb-2 truncate italic"></p>
            <p id="passwordError" class="text-[10px] text-red-500 font-bold mb-4 hidden uppercase tracking-widest">Incorrect Password</p>
            <input type="password" id="pdfPasswordInput" placeholder="Password" class="w-full bg-slate-800 border border-slate-700 text-white p-4 rounded-xl mb-4 text-center outline-none focus:border-blue-500">
            <div class="flex gap-3">
                <button onclick="handleUnlockSubmit()" class="flex-grow bg-blue-600 text-white py-3 rounded-xl font-bold">Unlock</button>
                <button onclick="cancelPassword()" class="px-4 bg-slate-800 text-slate-400 py-3 rounded-xl font-bold">Skip</button>
            </div>
        </div>
    </div>

    <div id="loader" class="hidden fixed inset-0 bg-slate-950/95 backdrop-blur-md z-[100] flex flex-col items-center justify-center p-10 text-center">
        <h2 id="loaderTitle" class="text-white text-3xl font-black mb-6 animate-pulse uppercase tracking-widest">Processing...</h2>
        <div class="w-80 bg-slate-800 h-3 rounded-full overflow-hidden border border-slate-700 shadow-2xl">
            <div id="progressBar" class="bg-blue-600 h-full w-0 transition-all duration-300"></div>
        </div>
        <p id="stats" class="text-blue-400 text-[10px] font-bold mt-6 uppercase tracking-[0.3em]">Preparing Memory</p>
    </div>

    <footer class="bg-slate-950 text-slate-300 pt-16 pb-8 px-6 border-t border-slate-800">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div>
                <h3 class="text-xl font-bold text-white uppercase">Shriram Stationers</h3>
                <p class="text-xs">Dausa, Rajasthan</p>
            </div>
            <div class="text-right">
                <p class="text-xl font-black text-white">9414711702</p>
                <p class="text-[10px] text-blue-500 font-bold uppercase tracking-widest">Safe-Margin Printing Hub</p>
            </div>
        </div>
    </footer>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
        const { PDFDocument, rgb, StandardFonts, degrees } = PDFLib;
        let pdfQueue = [];
        let finalPdfBytes = null;
        let currentResolver = null;

        document.getElementById('pdfPasswordInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') handleUnlockSubmit(); });

        new Sortable(document.getElementById('fileList'), { animation: 150, onEnd: () => { syncQueue(); } });
        function syncQueue() {
            const visualIds = Array.from(document.getElementById('fileList').children).map(c => c.dataset.id);
            pdfQueue = visualIds.map(id => pdfQueue.find(p => p.id == id));
        }

        document.getElementById('dropZone').onclick = () => document.getElementById('fileInput').click();
        document.getElementById('fileInput').onchange = async (e) => {
            document.getElementById('emptyMsg').style.display = 'none';
            for (let file of e.target.files) {
                const id = Date.now() + Math.random();
                const fileData = { id, file, rotation: 0 };
                pdfQueue.push(fileData);
                renderItem(fileData);
                generateThumb(fileData);
            }
        };

        function renderItem(item) {
            const div = document.createElement('div');
            div.className = 'file-item';
            div.dataset.id = item.id;
            div.innerHTML = `<div class="thumb-box bg-slate-950"><canvas data-canvas-id="${item.id}"></canvas></div>
                             <p class="text-[10px] font-bold text-white truncate w-full px-2 mt-3">${item.file.name}</p>
                             <button onclick="removeFile('${item.id}')" class="p-2 text-red-500 hover:text-red-400 transition"><i class="fas fa-trash-alt"></i></button>`;
            document.getElementById('fileList').appendChild(div);
        }

        async function generateThumb(item) {
            try {
                const pdf = await pdfjsLib.getDocument({ data: await item.file.arrayBuffer() }).promise;
                const page = await pdf.getPage(1);
                const canvas = document.querySelector(`[data-canvas-id="${item.id}"]`);
                const viewport = page.getViewport({ scale: 0.5 });
                canvas.height = viewport.height; canvas.width = viewport.width;
                await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
            } catch (e) { console.log("Protected PDF Thumbnail skipped."); }
        }

        function removeFile(id) {
            pdfQueue = pdfQueue.filter(p => p.id != id);
            const el = document.querySelector(`[data-id="${id}"]`);
            if(el) el.remove();
            if(!pdfQueue.length) document.getElementById('emptyMsg').style.display = 'block';
        }

        function sortFilesByName() {
            pdfQueue.sort((a, b) => a.file.name.localeCompare(b.file.name, undefined, {numeric: true}));
            document.getElementById('fileList').innerHTML = '';
            pdfQueue.forEach(item => renderItem(item));
        }

        function handleUnlockSubmit() {
            const val = document.getElementById('pdfPasswordInput').value;
            if(currentResolver) currentResolver(val);
        }

        function cancelPassword() {
            document.getElementById('passwordModal').classList.add('hidden');
            if(currentResolver) currentResolver(null);
        }

        async function processNUp() {
            if (!pdfQueue.length) return alert("Select files first!");
            
            const bar = document.getElementById('progressBar');
            const statText = document.getElementById('stats');
            const title = document.getElementById('loaderTitle');
            document.getElementById('loader').classList.remove('hidden');

            const n = parseInt(document.getElementById('nupValue').value);
            const balance = document.getElementById('balanceFix').checked;
            const usePageNum = document.getElementById('pageNum').checked;
            const useMargin = document.getElementById('marginFix').checked;

            const sheetW = (n === 4 || n === 6) ? 842 : 595;
            const sheetH = (n === 4 || n === 6) ? 595 : 842;

            const mergedPdf = await PDFDocument.create();
            const fontBold = await mergedPdf.embedFont(StandardFonts.HelveticaBold);
            const fontItalic = await mergedPdf.embedFont(StandardFonts.HelveticaOblique);

            let allSourcePages = [];

            // Stage 1: Load and Unlock
            title.innerText = "Extracting Pages...";
            for (let i = 0; i < pdfQueue.length; i++) {
                let item = pdfQueue[i];
                let percent = Math.round((i / pdfQueue.length) * 40);
                bar.style.width = percent + '%';
                statText.innerText = `Reading File ${i + 1} of ${pdfQueue.length}`;
                
                await new Promise(r => setTimeout(r, 10));

                let doc = null;
                const buffer = await item.file.arrayBuffer();
                
                while (!doc) {
                    try {
                        doc = await PDFDocument.load(buffer);
                    } catch (err) {
                        if (err.message.includes('password') || err.message.includes('encrypted')) {
                            document.getElementById('passwordModal').classList.remove('hidden');
                            document.getElementById('passwordFilename').innerText = item.file.name;
                            const pass = await new Promise(res => { currentResolver = res; });
                            if (pass === null) break;
                            try {
                                doc = await PDFDocument.load(buffer, { password: pass });
                                document.getElementById('passwordModal').classList.add('hidden');
                                document.getElementById('passwordError').classList.add('hidden');
                            } catch (retryErr) {
                                document.getElementById('passwordError').classList.remove('hidden');
                                document.getElementById('pdfPasswordInput').value = '';
                                document.getElementById('pdfPasswordInput').focus();
                                doc = null;
                            }
                        } else { break; }
                    }
                }

                if (!doc) continue;
                const pages = await mergedPdf.copyPages(doc, doc.getPageIndices());
                pages.forEach(p => allSourcePages.push(p));
                const multiplier = balance ? (n * 2) : n;
                const remainder = allSourcePages.length % multiplier;
                if (remainder !== 0) for (let k = 0; k < (multiplier - remainder); k++) allSourcePages.push(null);
            }

            // Stage 2: Render
            title.innerText = "Building Grid...";
            let rows, cols;
            if (n === 2) { rows = 2; cols = 1; }
            else if (n === 3) { rows = 3; cols = 1; }
            else if (n === 4) { rows = 2; cols = 2; }
            else if (n === 6) { rows = 2; cols = 3; }

            const footerSpace = 45; // NEW: Reserved black-text zone
            const sideMargin = useMargin ? 30 : 0;
            const cellW = (sheetW - (sideMargin * 2)) / cols;
            const cellH = (sheetH - footerSpace) / rows;
            const totalSheets = Math.ceil(allSourcePages.length / n);

            let sheetCounter = 0;
            for (let i = 0; i < allSourcePages.length; i += n) {
                await new Promise(r => setTimeout(r, 10));
                sheetCounter++;
                let percent = 40 + Math.round((sheetCounter / totalSheets) * 60);
                bar.style.width = percent + '%';
                statText.innerText = `Drawing Sheet ${sheetCounter} of ${totalSheets}`;

                const newPage = mergedPdf.addPage([sheetW, sheetH]);

                for (let j = 0; j < n; j++) {
                    const srcPage = allSourcePages[i + j];
                    if (!srcPage) continue;
                    const embedded = await mergedPdf.embedPage(srcPage);
                    const colIdx = j % cols;
                    const rowIdx = rows - 1 - Math.floor(j / cols);
                    
                    newPage.drawPage(embedded, { 
                        x: colIdx * cellW + sideMargin, 
                        y: (rowIdx * cellH) + footerSpace, // Shifted UP for footer safety
                        width: cellW, 
                        height: cellH 
                    });
                }
                
                // Color: Black (0,0,0)
                const textColor = rgb(0, 0, 0); 

                if (usePageNum) {
                    newPage.drawText(`${sheetCounter}`, { x: sheetW - 35, y: 15, size: 10, font: fontBold, color: textColor });
                }
                newPage.drawText("Pdf created on Shriramstationers.in", { x: 20, y: 15, size: 8, font: fontItalic, color: textColor });
            }

            finalPdfBytes = await mergedPdf.save();
            document.getElementById('loader').classList.add('hidden');
            document.getElementById('toolInterface').classList.add('hidden');
            document.getElementById('resultHub').classList.remove('hidden');
            window.scrollTo(0,0);
        }

        function downloadPDF() { const b = new Blob([finalPdfBytes], { type: 'application/pdf' }); const l = document.createElement('a'); l.href = URL.createObjectURL(b); l.download = `Shriram_NUp.pdf`; l.click(); }
        function previewPDF() { window.open(URL.createObjectURL(new Blob([finalPdfBytes], { type: 'application/pdf' })), '_blank'); }
    </script>
</body>
</html>
