<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merge PDF Hub | Shriram Stationers Dausa</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .drop-zone { border: 2px dashed #334155; background: rgba(30, 41, 59, 0.5); transition: 0.3s; }
        .drop-zone.drag-over { border-color: #3b82f6; background: rgba(59, 130, 246, 0.1); }
        #fileList { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1.5rem; }
        .file-item { background: #1e293b; border: 1px solid #334155; padding: 1rem; border-radius: 1.25rem; cursor: grab; }
        .thumb-box { width: 100%; height: 180px; background: #000; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 1px solid #334155; }
        .thumb-box canvas { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

    <nav class="bg-slate-900/95 backdrop-blur-md py-3 px-6 shadow-lg flex justify-between items-center sticky top-0 z-50 border-b border-slate-800">
        <div class="cursor-pointer flex items-center gap-3" onclick="window.location.href='https://www.shriramstationers.in'">
            <img src="../logo.jpg" alt="Logo" class="h-10 md:h-12 object-contain rounded-md border border-slate-700">
            <span class="text-xl font-bold tracking-tight text-slate-100 uppercase sm:block hidden">Shriram Stationers</span>
        </div>
        <div class="flex space-x-6 font-semibold text-slate-300 text-xs uppercase">
            <a href="https://www.shriramstationers.in" class="hover:text-white transition">Home</a>
            <a href="index.html" class="text-blue-400 border-b-2 border-blue-500 pb-1">PDF Tools</a>
        </div>
    </nav>

    <main class="flex-grow max-w-7xl mx-auto w-full px-4 py-10">
        <div id="toolInterface">
            <div class="grid lg:grid-cols-3 gap-8">
                <div class="lg:col-span-1 space-y-6">
                    <div class="bg-slate-800/40 rounded-3xl border border-slate-700 p-6 shadow-2xl">
                        <div id="dropZone" onclick="document.getElementById('fileInput').click()" class="drop-zone rounded-2xl py-12 flex flex-col items-center justify-center cursor-pointer mb-6 text-center">
                            <i class="fas fa-file-import text-4xl text-blue-500 mb-2"></i>
                            <p class="text-[10px] font-bold text-white uppercase tracking-widest">Add Chapters</p>
                            <input type="file" id="fileInput" multiple accept="application/pdf" class="hidden">
                        </div>

                        <div class="space-y-4 mb-6">
                            <label class="flex items-center justify-between p-3 bg-slate-900/40 rounded-xl border border-slate-700 cursor-pointer">
                                <span class="text-xs font-bold text-slate-300 uppercase">Binding Safety (10mm)</span>
                                <input type="checkbox" id="marginFix" checked class="w-5 h-5 accent-blue-500">
                            </label>
                            <label class="flex items-center justify-between p-3 bg-slate-900/40 rounded-xl border border-slate-700 cursor-pointer">
                                <span class="text-xs font-bold text-slate-300 uppercase">Balance Duplex</span>
                                <input type="checkbox" id="balanceFix" checked class="w-5 h-5 accent-blue-500">
                            </label>
                        </div>

                        <button onclick="mergePDFs()" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-5 rounded-2xl font-black uppercase shadow-lg text-sm">Merge & Process</button>
                    </div>
                </div>

                <div class="lg:col-span-2 bg-slate-800/40 rounded-3xl border border-slate-700 p-6 min-h-[500px]">
                    <div class="flex justify-between items-center mb-6 border-b border-slate-800 pb-4">
                        <h3 class="text-white font-bold text-[10px] uppercase tracking-widest">Reorder List</h3>
                        <button onclick="sortFilesByName()" class="text-[10px] font-bold uppercase bg-slate-700 hover:bg-blue-600 text-white px-4 py-2 rounded-lg transition">Natural Sort</button>
                    </div>
                    <div id="fileList"></div>
                    <div id="emptyMsg" class="h-48 flex items-center justify-center text-slate-700 uppercase font-bold text-[10px] tracking-widest">List is empty</div>
                </div>
            </div>
        </div>

        <section id="resultHub" class="hidden text-center py-20 bg-slate-800/60 rounded-3xl border-2 border-blue-500/30">
            <h2 class="text-3xl font-extrabold mb-8 uppercase tracking-tighter">Module Assembled</h2>
            <div class="flex justify-center gap-4">
                <button onclick="previewPDF()" class="bg-slate-700 text-white px-10 py-4 rounded-xl font-bold uppercase text-xs">Preview</button>
                <button onclick="downloadPDF()" class="bg-white text-slate-900 px-10 py-4 rounded-xl font-bold uppercase text-xs shadow-xl">Download</button>
            </div>
        </section>
    </main>

    <div id="loader" class="hidden fixed inset-0 bg-slate-950/95 z-[100] flex flex-col items-center justify-center p-10">
        <h2 class="text-white text-3xl font-black mb-6 animate-pulse uppercase">Building PDF...</h2>
        <div class="w-80 bg-slate-800 h-2 rounded-full overflow-hidden border border-slate-700">
            <div id="progressBar" class="bg-blue-600 h-full w-0 transition-all duration-300"></div>
        </div>
        <p id="stats" class="text-blue-400 text-[10px] font-bold mt-4 uppercase tracking-[0.2em]">Safe Scale Processing</p>
    </div>

    <div id="footer-placeholder"></div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
        const { PDFDocument, rgb, StandardFonts, degrees } = PDFLib;
        let pdfQueue = [];
        let finalPdfBytes = null;

        fetch('../footer.html').then(r => r.text()).then(d => document.getElementById('footer-placeholder').innerHTML = d);

        // DRAG AND DROP SORTING [cite: 2026-02-23]
        new Sortable(document.getElementById('fileList'), { 
            animation: 150, 
            onEnd: () => { 
                const visualIds = Array.from(document.getElementById('fileList').children).map(c => c.dataset.id);
                pdfQueue = visualIds.map(id => pdfQueue.find(p => p.id == id));
            } 
        });

        document.getElementById('fileInput').onchange = (e) => handleFiles(e.target.files);

        async function handleFiles(files) {
            document.getElementById('emptyMsg').style.display = 'none';
            for (let file of files) {
                if (file.type !== 'application/pdf') continue;
                const id = Date.now() + Math.random();
                const fileData = { id, file, rotation: 0 };
                pdfQueue.push(fileData);
                renderItem(fileData);
                generateThumb(fileData);
            }
        }

        function renderItem(item) {
            const div = document.createElement('div');
            div.className = 'file-item';
            div.dataset.id = item.id;
            div.innerHTML = `<div class="thumb-box mb-3"><canvas data-canvas-id="${item.id}"></canvas></div>
                <p class="text-[9px] font-bold text-slate-400 truncate px-1 uppercase">${item.file.name}</p>
                <div class="flex gap-2 mt-2">
                    <button onclick="removeItem('${item.id}')" class="w-full py-2 bg-slate-900 rounded-md text-[10px] hover:text-red-500 transition uppercase font-black">Remove</button>
                </div>`;
            document.getElementById('fileList').appendChild(div);
        }

        async function generateThumb(item) {
            try {
                const pdf = await pdfjsLib.getDocument({ data: await item.file.arrayBuffer() }).promise;
                const page = await pdf.getPage(1);
                const canvas = document.querySelector(`[data-canvas-id="${item.id}"]`);
                const v = page.getViewport({ scale: 0.5 });
                canvas.height = v.height; canvas.width = v.width;
                await page.render({ canvasContext: canvas.getContext('2d'), viewport: v }).promise;
            } catch (e) { console.log("Protected PDF"); }
        }

        // RESTORED SORT BY NAME [cite: 2026-02-23]
        function sortFilesByName() {
            pdfQueue.sort((a, b) => a.file.name.localeCompare(b.file.name, undefined, {numeric: true}));
            document.getElementById('fileList').innerHTML = '';
            pdfQueue.forEach(item => { renderItem(item); generateThumb(item); });
        }

        function removeItem(id) {
            pdfQueue = pdfQueue.filter(p => p.id != id);
            document.querySelector(`[data-id="${id}"]`).remove();
            if(!pdfQueue.length) document.getElementById('emptyMsg').style.display = 'flex';
        }

        // --- THE FIXED LAYOUT ENGINE [cite: 2026-02-23] ---
        async function mergePDFs() {
            if(!pdfQueue.length) return alert("Select files first!");
            document.getElementById('loader').classList.remove('hidden');
            const bar = document.getElementById('progressBar');

            const mergedDoc = await PDFDocument.create();
            const fontI = await mergedDoc.embedFont(StandardFonts.HelveticaOblique);
            const useMargin = document.getElementById('marginFix').checked;
            
            let totalPageCounter = 0;

            for (let i = 0; i < pdfQueue.length; i++) {
                let item = pdfQueue[i];
                let percent = Math.round((i / pdfQueue.length) * 100);
                bar.style.width = percent + '%';
                await new Promise(r => setTimeout(r, 10));

                const buffer = await item.file.arrayBuffer();
                const doc = await PDFDocument.load(buffer, { ignoreEncryption: true });
                const sourceIndices = doc.getPageIndices();

                for (const idx of sourceIndices) {
                    totalPageCounter++;
                    const [embeddedPage] = await mergedDoc.embedPages([doc.getPage(idx)]);
                    const { width, height } = embeddedPage;
                    
                    const newPage = mergedDoc.addPage([width, height]);
                    const isOdd = totalPageCounter % 2 !== 0;

                    // LAYOUT FIX [cite: 2026-02-23]
                    // We scale to 95% and offset by 10mm (approx 28 points)
                    let xOffset = 0;
                    let scale = 1.0;

                    if (useMargin) {
                        scale = 0.95; // Shrink slightly to avoid edges
                        const marginWidth = 28; // 10mm
                        // Odd: Margin on Left. Even: Margin on Right.
                        xOffset = isOdd ? marginWidth : (width * (1 - scale) - marginWidth);
                    }

                    newPage.drawPage(embeddedPage, {
                        x: xOffset,
                        y: (height * (1 - scale)) / 2, // Center vertically
                        width: width * scale,
                        height: height * scale
                    });

                    // Watermark [cite: 2026-02-23]
                    newPage.drawText("Pdf created on Shriramstationers.in", {
                        x: 20, y: 15, size: 8, font: fontI, color: rgb(0, 0, 0)
                    });
                }
                
                if(document.getElementById('balanceFix').checked && sourceIndices.length % 2 !== 0) {
                    totalPageCounter++;
                    const blank = mergedDoc.addPage([595, 842]);
                    blank.drawText("Pdf created on Shriramstationers.in", {
                        x: 20, y: 15, size: 8, font: fontI, color: rgb(0, 0, 0)
                    });
                }
            }
            
            finalPdfBytes = await mergedDoc.save();
            document.getElementById('loader').classList.add('hidden');
            document.getElementById('toolInterface').classList.add('hidden');
            document.getElementById('resultHub').classList.remove('hidden');
            window.scrollTo(0,0);
        }

        function downloadPDF() { const b = new Blob([finalPdfBytes], { type: 'application/pdf' }); const l = document.createElement('a'); l.href = URL.createObjectURL(b); l.download = `Shriram_Merged.pdf`; l.click(); }
        function previewPDF() { window.open(URL.createObjectURL(new Blob([finalPdfBytes], { type: 'application/pdf' })), '_blank'); }
    </script>
</body>
</html>
