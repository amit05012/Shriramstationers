<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merge PDF | Shriram Stationers Dausa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .drop-zone { border: 2px dashed #334155; background: rgba(30, 41, 59, 0.5); transition: 0.3s; }
        .drop-zone.drag-over { border-color: #60a5fa; background: rgba(59, 130, 246, 0.1); }
        .file-item { background: #1e293b; border: 1px solid #334155; transition: 0.3s; cursor: grab; }
        .thumb-box { width: 50px; height: 70px; background: #0f172a; border-radius: 4px; overflow: hidden; border: 1px solid #444; flex-shrink: 0; }
        .thumb-box canvas { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

    <nav class="bg-slate-900/95 backdrop-blur-md py-3 px-6 shadow-lg flex justify-between items-center sticky top-0 z-50 border-b border-slate-800">
        <div class="cursor-pointer flex items-center gap-3" onclick="window.location.href='https://www.shriramstationers.in'">
            <img src="../logo.jpg" alt="Logo" class="h-12 md:h-14 object-contain rounded-md border border-slate-700">
            <span class="text-2xl font-bold tracking-tight text-slate-100 uppercase">Shriram Stationers</span>
        </div>
        <div class="hidden md:flex space-x-8 font-semibold text-slate-300 items-center">
            <a href="https://www.shriramstationers.in" class="hover:text-white transition">Home</a>
            <a href="index.html" class="text-blue-400">PDF Tools</a>
        </div>
    </nav>

    <main class="flex-grow max-w-5xl mx-auto w-full px-6 py-12">
        <section id="resultHub" class="hidden mb-12 p-10 rounded-3xl bg-slate-800/60 border-2 border-blue-500/30 text-center animate-in fade-in duration-500">
            <h2 class="text-3xl font-extrabold text-white mb-4">Merge Complete!</h2>
            <div class="flex justify-center gap-4">
                <button onclick="previewPDF()" class="bg-slate-700 text-white px-8 py-4 rounded-xl font-bold hover:bg-slate-600 transition shadow-lg">Preview</button>
                <button onclick="downloadPDF()" class="bg-white text-slate-900 px-8 py-4 rounded-xl font-bold hover:bg-slate-200 transition shadow-lg">Download</button>
            </div>
            <button onclick="location.reload()" class="mt-8 text-xs text-slate-500 underline uppercase font-bold">Start New</button>
        </section>

        <div id="toolInterface">
            <div class="bg-slate-800/40 rounded-3xl border border-slate-700 p-8 shadow-2xl">
                <div id="dropZone" class="drop-zone rounded-2xl py-12 flex flex-col items-center justify-center cursor-pointer mb-8">
                    <i class="fas fa-file-pdf text-5xl text-red-500 mb-3"></i>
                    <p class="text-lg font-bold text-white uppercase tracking-wider">Select PDF Files</p>
                    <input type="file" id="fileInput" multiple accept="application/pdf" class="hidden">
                </div>

                <div class="grid md:grid-cols-2 gap-4 mb-8">
                    <label class="flex items-center justify-between p-4 bg-slate-900/50 rounded-xl border border-slate-700 cursor-pointer">
                        <span class="text-xs font-bold text-slate-300">Binding Margin (1cm)</span>
                        <input type="checkbox" id="marginFix" checked class="w-5 h-5 accent-blue-500">
                    </label>
                    <label class="flex items-center justify-between p-4 bg-slate-900/50 rounded-xl border border-slate-700 cursor-pointer">
                        <span class="text-xs font-bold text-slate-300">Add Blank for Odd Counts</span>
                        <input type="checkbox" id="balanceFix" checked class="w-5 h-5 accent-blue-500">
                    </label>
                </div>

                <div class="bg-slate-800/60 rounded-2xl p-6 mb-8">
                    <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
                        <h3 class="text-white font-bold flex items-center gap-2">File Sorting</h3>
                        <button onclick="sortPDFsByName()" class="text-[10px] font-bold uppercase tracking-wider bg-slate-700 hover:bg-blue-600 text-white px-3 py-2 rounded-lg transition">Sort by Name</button>
                    </div>
                    <div id="fileList" class="space-y-3"></div>
                </div>

                <button onclick="mergePDFs()" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-5 rounded-2xl font-black text-xl shadow-lg transition">MERGE DOCUMENTS</button>
            </div>
        </div>
    </main>

    <footer id="contact" class="bg-slate-950 text-slate-400 pt-16 pb-8 px-6 border-t border-slate-800">
        <div class="max-w-6xl mx-auto grid md:grid-cols-3 gap-12 text-left">
            <div>
                <h3 class="text-xl font-bold mb-4 text-white">Shriram Stationers</h3>
                <p class="text-sm">Opposite S.B.I. Bank, Agra Road, Dausa</p>
            </div>
            <div class="md:text-right col-span-2">
                <p class="text-xl font-black text-white">9414711702</p>
                <p class="text-xs text-blue-500 font-bold uppercase">50 Paisa Per Side Printing</p>
            </div>
        </div>
    </footer>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
        const { PDFDocument, rgb, StandardFonts, degrees } = PDFLib;
        let pdfQueue = [];
        let finalPdfBytes = null;
        const fileInput = document.getElementById('fileInput');
        const fileListContainer = document.getElementById('fileList');

        new Sortable(fileListContainer, { animation: 150, onEnd: () => { syncQueue(); } });

        function syncQueue() {
            const visualIds = Array.from(fileListContainer.children).map(c => c.dataset.id);
            pdfQueue = visualIds.map(id => pdfQueue.find(p => p.id == id));
        }

        document.getElementById('dropZone').onclick = () => fileInput.click();
        fileInput.onchange = (e) => handleFiles(e.target.files);

        async function handleFiles(files) {
            for (let file of files) {
                if (file.type !== 'application/pdf') continue;
                const id = Date.now() + Math.random();
                const fileData = { id, file, rotation: 0 };
                pdfQueue.push(fileData);
                renderItem(fileData);
                generateThumb(fileData);
            }
        }

        async function generateThumb(item) {
            const data = await item.file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data }).promise;
            const page = await pdf.getPage(1);
            const canvas = document.querySelector(`[data-canvas-id="${item.id}"]`);
            const viewport = page.getViewport({ scale: 0.2 });
            canvas.height = viewport.height; canvas.width = viewport.width;
            await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
        }

        function renderItem(item) {
            const div = document.createElement('div');
            div.className = 'file-item p-4 rounded-xl flex items-center gap-4';
            div.dataset.id = item.id;
            div.innerHTML = `<div class="thumb-box"><canvas data-canvas-id="${item.id}"></canvas></div><p class="text-xs font-bold text-white flex-grow truncate">${item.file.name}</p>
                             <button onclick="rotateItem('${item.id}')" class="p-2 bg-slate-900 rounded-lg"><i class="fas fa-rotate-right"></i></button>`;
            fileListContainer.appendChild(div);
        }

        function sortPDFsByName() {
            pdfQueue.sort((a, b) => a.file.name.localeCompare(b.file.name, undefined, {numeric: true}));
            fileListContainer.innerHTML = '';
            pdfQueue.forEach(item => { renderItem(item); generateThumb(item); });
        }

        function rotateItem(id) {
            const item = pdfQueue.find(p => p.id == id);
            item.rotation = (item.rotation + 90) % 360;
            document.querySelector(`[data-canvas-id="${id}"]`).style.transform = `rotate(${item.rotation}deg)`;
        }

        async function mergePDFs() {
            const mergedPdf = await PDFDocument.create();
            const fontI = await mergedPdf.embedFont(StandardFonts.HelveticaOblique);
            for (let item of pdfQueue) {
                const doc = await PDFDocument.load(await item.file.arrayBuffer());
                const pages = await mergedPdf.copyPages(doc, doc.getPageIndices());
                pages.forEach(p => {
                    if(item.rotation !== 0) p.setRotation(degrees(item.rotation));
                    mergedPdf.addPage(p);
                    p.drawText("Pdf created on Shriramstationers.in", { x: 20, y: 15, size: 8, font: fontI, color: rgb(0.5, 0.5, 0.5) });
                });
                if(document.getElementById('balanceFix').checked && pages.length % 2 !== 0) mergedPdf.addPage([595, 842]);
            }
            finalPdfBytes = await mergedPdf.save();
            document.getElementById('toolInterface').classList.add('hidden');
            document.getElementById('resultHub').classList.remove('hidden');
        }

        function downloadPDF() { const blob = new Blob([finalPdfBytes], { type: 'application/pdf' }); const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = `Shriram_Merged.pdf`; link.click(); }
        function previewPDF() { window.open(URL.createObjectURL(new Blob([finalPdfBytes], { type: 'application/pdf' })), '_blank'); }
    </script>
</body>
</html>
