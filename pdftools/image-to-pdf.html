<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to PDF | Shriram Stationers Dausa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .drop-zone { border: 2px dashed #334155; background: rgba(30, 41, 59, 0.5); transition: 0.3s; }
        .drop-zone.drag-over { border-color: #60a5fa; background: rgba(59, 130, 246, 0.1); }
        .img-container { position: relative; cursor: grab; }
        .page-badge { position: absolute; top: 4px; left: 4px; background: #3b82f6; color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; z-index: 10; }
        .remove-btn { position: absolute; top: 4px; right: 4px; background: #ef4444; color: white; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; z-index: 10; }
        .social-icon { transition: 0.4s; color: #475569; }
        .fa-whatsapp:hover { color: #25D366; filter: drop-shadow(0 0 10px #25D366); }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

    <nav class="bg-slate-900/95 backdrop-blur-md py-3 px-6 shadow-lg flex justify-between items-center sticky top-0 z-50 border-b border-slate-800">
        <div class="cursor-pointer flex items-center gap-3" onclick="window.location.href='https://www.shriramstationers.in'">
            <img src="../logo.jpg" alt="Logo" class="h-12 md:h-14 object-contain rounded-md border border-slate-700">
            <span class="text-2xl font-bold tracking-tight hidden sm:block text-slate-100 uppercase">Shriram Stationers</span>
        </div>
        <div class="hidden md:flex space-x-8 font-semibold text-slate-300 items-center">
            <a href="https://www.shriramstationers.in" class="hover:text-white transition">Home</a>
            <a href="index.html" class="text-blue-400 border-b-2 border-blue-500 pb-1">PDF Tools</a>
        </div>
    </nav>

    <main class="flex-grow max-w-6xl mx-auto w-full px-6 py-12">
        <section id="resultHub" class="hidden mb-12 p-10 rounded-3xl bg-slate-800/60 border-2 border-blue-500/30 text-center animate-in fade-in duration-500">
            <h2 class="text-3xl font-extrabold text-white mb-4">Conversion Success!</h2>
            <div class="flex justify-center gap-4">
                <button onclick="previewPDF()" class="bg-slate-700 text-white px-10 py-4 rounded-xl font-bold hover:bg-slate-600 transition">Preview</button>
                <button onclick="downloadPDF()" class="bg-white text-slate-900 px-10 py-4 rounded-xl font-bold hover:bg-slate-200 transition">Download</button>
            </div>
            <button onclick="location.reload()" class="mt-8 text-xs text-slate-500 underline font-bold uppercase tracking-widest">Create New</button>
        </section>

        <div id="toolInterface">
            <div class="grid lg:grid-cols-3 gap-8">
                <div class="lg:col-span-1 space-y-6">
                    <div class="bg-slate-800/40 rounded-3xl border border-slate-700 p-6 shadow-2xl">
                        <div id="dropZone" class="drop-zone rounded-2xl py-12 flex flex-col items-center justify-center cursor-pointer mb-6 text-center">
                            <i class="fas fa-image text-4xl text-blue-500 mb-2"></i>
                            <p class="text-[10px] font-bold text-white uppercase tracking-widest">Add Images</p>
                            <input type="file" id="fileInput" multiple accept="image/*" class="hidden">
                        </div>
                        <div class="space-y-4 mb-6">
                            <label class="flex items-center justify-between p-3 bg-slate-900/40 rounded-xl border border-slate-700 cursor-pointer">
                                <span class="text-xs font-bold text-slate-300">Add Page Numbers</span>
                                <input type="checkbox" id="pageNum" checked class="w-4 h-4 accent-blue-500">
                            </label>
                        </div>
                        <button id="mainBtn" onclick="processImages()" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-4 rounded-2xl font-black text-xl shadow-lg transition">GENERATE PDF</button>
                    </div>
                </div>

                <div class="lg:col-span-2">
                    <div class="bg-slate-800/40 rounded-3xl border border-slate-700 p-6 min-h-[500px]">
                        <div class="flex justify-between items-center mb-6 border-b border-slate-800 pb-4">
                            <h3 class="text-white font-bold flex items-center gap-2">Image Sequence</h3>
                            <button onclick="sortImagesByName()" class="text-[10px] font-bold uppercase tracking-wider bg-slate-700 hover:bg-blue-600 text-white px-3 py-2 rounded-lg transition">Sort by Name</button>
                        </div>
                        <div id="previewGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4"></div>
                        <div id="emptyMsg" class="h-64 flex flex-col items-center justify-center text-slate-700">
                            <i class="fas fa-images text-4xl mb-3"></i>
                            <p class="font-bold uppercase text-xs tracking-widest">No images selected</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer id="contact" class="bg-slate-950 text-slate-300 pt-16 pb-8 px-6 border-t border-slate-800">
        <div class="max-w-6xl mx-auto grid md:grid-cols-3 gap-12 mb-12 text-left">
            <div>
                <h3 class="text-2xl font-bold mb-4 flex items-center gap-3 text-white"><img src="../logo.jpg" alt="Logo" class="h-8 rounded-sm"> Shriram Stationers</h3>
                <p class="text-slate-500 mb-6 text-sm leading-relaxed">Trusted since Sept 5, 2024 for Dausa students.</p>
                <div class="flex gap-4">
                    <a href="https://wa.me/919414711702" target="_blank" class="social-icon text-xl"><i class="fab fa-whatsapp"></i></a>
                </div>
            </div>
            <div>
                <h4 class="text-lg font-bold mb-6 text-slate-100 uppercase tracking-wider text-sm">Shop Address</h4>
                <p class="text-sm text-slate-400">Opposite S.B.I. Bank, Agra Road, Dausa</p>
            </div>
            <div class="md:text-right">
                <p class="text-xl font-bold text-white">9414711702</p>
                <p class="text-xs text-blue-500 font-bold uppercase">50 Paisa Per Side Printing</p>
            </div>
        </div>
    </footer>

    <script>
        const previewGrid = document.getElementById('previewGrid');
        const emptyMsg = document.getElementById('emptyMsg');
        const fileInput = document.getElementById('fileInput');
        let imageList = [];
        let finalPDF = null;

        new Sortable(previewGrid, { animation: 150, onEnd: () => { syncImageOrder(); } });

        function syncImageOrder() {
            const visualIds = Array.from(previewGrid.children).map(c => c.dataset.id);
            imageList = visualIds.map(id => imageList.find(img => img.id == id));
            renderPreview();
        }

        document.getElementById('dropZone').onclick = () => fileInput.click();
        fileInput.onchange = (e) => handleFiles(e.target.files);

        async function handleFiles(files) {
            emptyMsg.style.display = 'none';
            for (let file of files) {
                if (!file.type.startsWith('image/')) continue;
                const data = await getBase64(file);
                imageList.push({ id: Date.now() + Math.random(), name: file.name, data });
            }
            renderPreview();
        }

        function renderPreview() {
            previewGrid.innerHTML = '';
            imageList.forEach((img, index) => {
                const div = document.createElement('div');
                div.className = 'img-container bg-slate-900 rounded-lg overflow-hidden border border-slate-700 aspect-[3/4]';
                div.dataset.id = img.id;
                div.innerHTML = `<div class="page-badge">${index + 1}</div><div class="remove-btn" onclick="removeItem('${img.id}')">×</div><img src="${img.data}" class="w-full h-full object-cover">`;
                previewGrid.appendChild(div);
            });
        }

        function sortImagesByName() {
            imageList.sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true}));
            renderPreview();
        }

        function removeItem(id) { imageList = imageList.filter(img => img.id != id); renderPreview(); }

        async function processImages() {
            if (!imageList.length) return alert("Select images!");
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');
            for (let i = 0; i < imageList.length; i++) {
                if (i > 0) pdf.addPage();
                pdf.addImage(imageList[i].data, 'JPEG', 0, 0, 210, 297, undefined, 'FAST');
                if (document.getElementById('pageNum').checked) {
                    pdf.setFontSize(12); pdf.text(`${i + 1}`, 195, 287);
                }
                pdf.setFontSize(10); pdf.text("Pdf created on Shriramstationers.in", 10, 287);
            }
            finalPDF = pdf;
            document.getElementById('toolInterface').classList.add('hidden');
            document.getElementById('resultHub').classList.remove('hidden');
        }

        function getBase64(file) { return new Promise(res => { const r = new FileReader(); r.onload = e => res(e.target.result); r.readAsDataURL(file); }); }
        function downloadPDF() { finalPDF.save(`Shriram_Images_${Date.now()}.pdf`); }
        function previewPDF() { window.open(URL.createObjectURL(finalPDF.output('blob')), '_blank'); }
    </script>
</body>
</html>
