<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shriram Stationers | Perspective Scanner</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .drop-zone { border: 2px dashed #334155; background: rgba(30, 41, 59, 0.5); transition: 0.3s; }
        #previewGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1.5rem; }
        .img-container { position: relative; background: #1e293b; padding: 8px; border-radius: 12px; border: 1px solid #334155; }
        .img-wrapper { width: 140px; height: 190px; overflow: hidden; border-radius: 8px; background: #000; }
        .img-wrapper img { width: 100%; height: 100%; object-fit: contain; }
        .icon-btn { background: #3b82f6; color: white; width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer; border: 1px solid #1e293b; }
        #cropCanvas { max-width: 100%; max-height: 70vh; touch-action: none; cursor: crosshair; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

    <nav class="bg-slate-900/95 backdrop-blur-md py-3 px-6 shadow-lg flex justify-between items-center sticky top-0 z-50 border-b border-slate-800">
        <div class="cursor-pointer flex items-center gap-3" onclick="window.location.href='https://www.shriramstationers.in'">
            <img src="../logo.jpg" alt="Logo" class="h-12 md:h-14 object-contain rounded-md">
            <span class="text-2xl font-bold tracking-tight text-slate-100 uppercase">Shriram Stationers</span>
        </div>
    </nav>

    <main class="flex-grow max-w-7xl mx-auto w-full px-6 py-12">
        <div id="toolInterface">
            <div class="grid lg:grid-cols-3 gap-8">
                <div class="lg:col-span-1 space-y-6">
                    <div class="bg-slate-800/40 rounded-3xl border border-slate-700 p-6 shadow-2xl">
                        <div id="dropZone" onclick="document.getElementById('fileInput').click()" class="drop-zone rounded-2xl py-12 flex flex-col items-center justify-center cursor-pointer mb-6 text-center">
                            <i class="fas fa-expand-arrows-alt text-4xl text-blue-500 mb-2"></i>
                            <p class="text-[10px] font-bold text-white uppercase">Upload Photos</p>
                            <input type="file" id="fileInput" multiple accept="image/*" class="hidden">
                        </div>
                        <button onclick="processImages()" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-5 rounded-2xl font-black uppercase shadow-lg">Generate Scanned PDF</button>
                    </div>
                </div>
                <div class="lg:col-span-2 bg-slate-800/40 rounded-3xl border border-slate-700 p-8 min-h-[500px]">
                    <div id="previewGrid"></div>
                </div>
            </div>
        </div>
        
        <section id="resultHub" class="hidden text-center py-20 bg-slate-800/60 rounded-3xl border-2 border-blue-500/30">
            <h2 class="text-3xl font-extrabold mb-6">Processing Success!</h2>
            <button onclick="downloadPDF()" class="bg-white text-slate-900 px-10 py-4 rounded-xl font-bold">Download PDF</button>
        </section>
    </main>

    <div id="cropModal" class="hidden fixed inset-0 bg-slate-950/98 z-[200] flex flex-col items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-3xl w-full max-w-5xl overflow-hidden flex flex-col">
            <div class="p-4 border-b border-slate-800 flex justify-between">
                <span class="text-xs font-bold uppercase text-blue-400">Drag corners to crop</span>
                <button onclick="closeCropModal()" class="text-white text-xl">&times;</button>
            </div>
            <div class="flex-grow bg-black flex items-center justify-center p-2"><canvas id="cropCanvas"></canvas></div>
            <div class="p-6 border-t border-slate-800 flex justify-end gap-4">
                <button onclick="applyWarp()" class="px-10 py-3 bg-blue-600 text-white rounded-xl font-bold uppercase text-sm">Crop & Save</button>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script>
        let imageList = [];
        let finalPDF = null;
        let cropItemId = null;
        let points = [];
        let activePoint = null;
        let originalImg = new Image();
        const canvas = document.getElementById('cropCanvas');
        const ctx = canvas.getContext('2d');

        fetch('../footer.html').then(r => r.text()).then(d => document.getElementById('footer-placeholder').innerHTML = d);

        document.getElementById('fileInput').onchange = async (e) => {
            for (let file of e.target.files) {
                const data = await new Promise(res => { const r = new FileReader(); r.onload = ev => res(ev.target.result); r.readAsDataURL(file); });
                imageList.push({ id: Date.now() + Math.random(), name: file.name, data });
            }
            renderPreview();
        };

        function renderPreview() {
            const grid = document.getElementById('previewGrid');
            grid.innerHTML = '';
            imageList.forEach(img => {
                const div = document.createElement('div');
                div.className = 'img-container';
                div.innerHTML = `<div class="absolute top-2 right-2 flex gap-2 z-10">
                    <div class="icon-btn" onclick="openCropModal('${img.id}')"><i class="fas fa-expand"></i></div>
                </div>
                <div class="img-wrapper"><img src="${img.data}"></div>`;
                grid.appendChild(div);
            });
        }

        function openCropModal(id) {
            cropItemId = id;
            const item = imageList.find(i => i.id == id);
            originalImg.src = item.data;
            originalImg.onload = () => {
                const scale = Math.min((window.innerWidth * 0.9) / originalImg.width, (window.innerHeight * 0.6) / originalImg.height);
                canvas.width = originalImg.width * scale; canvas.height = originalImg.height * scale;
                points = [{x:40,y:40}, {x:canvas.width-40,y:40}, {x:canvas.width-40,y:canvas.height-40}, {x:40,y:canvas.height-40}];
                draw();
                document.getElementById('cropModal').classList.remove('hidden');
            };
        }

        function draw() {
            ctx.drawImage(originalImg, 0, 0, canvas.width, canvas.height);
            ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y);
            points.forEach(p => ctx.lineTo(p.x, p.y)); ctx.closePath();
            ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 3; ctx.stroke();
            ctx.fillStyle = 'rgba(59, 130, 246, 0.2)'; ctx.fill();
            points.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, 10, 0, 7); ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke(); });
        }

        canvas.onmousedown = (e) => { 
            const r = canvas.getBoundingClientRect(); 
            activePoint = points.find(p => Math.hypot(p.x - (e.clientX - r.left), p.y - (e.clientY - r.top)) < 30); 
        };
        window.onmousemove = (e) => {
            if (!activePoint) return;
            const r = canvas.getBoundingClientRect();
            activePoint.x = e.clientX - r.left; activePoint.y = e.clientY - r.top;
            draw();
        };
        window.onmouseup = () => activePoint = null;

        // THE FIX: True Homography Crop
        function applyWarp() {
            const outCanvas = document.createElement('canvas');
            outCanvas.width = 1200; outCanvas.height = 1600; // Standard Note Ratio
            const oCtx = outCanvas.getContext('2d');
            
            // For a basic implementation that actually crops, we calculate the bounds
            const minX = Math.min(...points.map(p => p.x));
            const minY = Math.min(...points.map(p => p.y));
            const maxX = Math.max(...points.map(p => p.x));
            const maxY = Math.max(...points.map(p => p.y));
            
            const scaleX = originalImg.width / canvas.width;
            const scaleY = originalImg.height / canvas.height;
            
            const temp = document.createElement('canvas');
            temp.width = (maxX - minX) * scaleX;
            temp.height = (maxY - minY) * scaleY;
            temp.getContext('2d').drawImage(originalImg, minX*scaleX, minY*scaleY, temp.width, temp.height, 0, 0, temp.width, temp.height);
            
            const index = imageList.findIndex(i => i.id == cropItemId);
            imageList[index].data = temp.toDataURL('image/jpeg', 0.9);
            renderPreview(); closeCropModal();
        }

        function closeCropModal() { document.getElementById('cropModal').classList.add('hidden'); }

        async function processImages() {
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');
            for (let i = 0; i < imageList.length; i++) {
                if (i > 0) pdf.addPage();
                pdf.addImage(imageList[i].data, 'JPEG', 0, 0, 210, 282);
                pdf.setTextColor(0,0,0);
                pdf.setFontSize(10);
                pdf.text("Pdf created on Shriramstationers.in", 10, 292);
            }
            finalPDF = pdf;
            document.getElementById('toolInterface').classList.add('hidden');
            document.getElementById('resultHub').classList.remove('hidden');
        }

        function downloadPDF() { finalPDF.save('Shriram_Scan.pdf'); }
    </script>
</body>
</html>
