<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merge PDF - Shriram Stationers Dausa</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #0f172a; color: #f8fafc; scroll-behavior: smooth; }
        .tool-card { transition: all 0.3s ease; background-color: #1e293b; border: 1px solid #334155; }
        .tool-card:hover { transform: translateY(-5px); border-color: #3b82f6; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .pdf-thumb { width: 50px; height: 65px; object-fit: cover; border-radius: 4px; border: 1px solid #475569; background: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="antialiased">

    <nav class="bg-slate-900/95 py-3 px-6 shadow-lg flex justify-between items-center sticky top-0 z-50 border-b border-slate-800">
        <div class="cursor-pointer flex items-center gap-3" onclick="window.location.href='/'">
            <img src="../logo.jpg" alt="Shriram Stationers" class="h-10 rounded-md border border-slate-700">
            <span class="text-xl font-bold text-slate-100">Shriram Stationers</span>
        </div>
        <a href="/" class="text-slate-300 hover:text-white font-semibold transition">Back to Shop</a>
    </nav>

    <section class="max-w-4xl mx-auto py-20 px-6 text-center">
        <h1 class="text-4xl md:text-5xl font-extrabold mb-4 tracking-tight">Student <span class="text-blue-400">PDF Merge</span></h1>
        <p class="text-slate-400 mb-12 text-lg">Combine multiple PDFs into one professional document for easy printing.</p>

        <div onclick="openWorkspace('merge')" class="tool-card p-10 rounded-3xl cursor-pointer max-w-sm mx-auto group">
            <div class="w-20 h-20 bg-blue-900/50 text-blue-400 rounded-2xl flex items-center justify-center mx-auto mb-6 group-hover:bg-blue-600 group-hover:text-white transition-all border border-blue-800">
                <i class="fas fa-layer-group text-3xl"></i>
            </div>
            <h3 class="font-bold text-2xl text-white">Start Merging</h3>
            <p class="text-sm text-slate-500 mt-2">With Smart Sorting & Double-Sided Fix</p>
        </div>
    </section>

    <div id="workspace-modal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-sm z-[100] hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-3xl w-full max-w-2xl flex flex-col max-h-[90vh] shadow-2xl">
            
            <div class="p-6 border-b border-slate-800 flex justify-between items-center">
                <h2 class="text-xl font-bold text-white"><i class="fas fa-layer-group text-blue-400 mr-2"></i> PDF Workspace</h2>
                <button onclick="closeWorkspace()" class="text-slate-400 hover:text-red-400 transition text-xl"><i class="fas fa-times"></i></button>
            </div>

            <div class="p-6 overflow-y-auto flex-grow custom-scrollbar">
                <div id="dropzone" class="border-2 border-dashed border-slate-600 rounded-2xl p-8 text-center cursor-pointer mb-6 hover:border-blue-500 hover:bg-slate-800/30 transition" onclick="document.getElementById('file-input').click()">
                    <i class="fas fa-plus-circle text-4xl text-blue-500 mb-2"></i>
                    <p class="text-slate-200 font-semibold">Click to upload your PDF files</p>
                    <input type="file" id="file-input" class="hidden" multiple accept="application/pdf">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6">
                    <button onclick="sortFilesByName()" class="bg-slate-800 text-slate-200 py-3 rounded-xl text-sm border border-slate-700 hover:border-blue-500 transition font-medium">
                        <i class="fas fa-sort-alpha-down mr-2"></i> Sort by File Name
                    </button>
                    <label class="flex items-center gap-3 cursor-pointer p-3 bg-slate-800 rounded-xl border border-slate-700 hover:border-blue-500 transition">
                        <input type="checkbox" id="opt-page-numbers" class="w-5 h-5 rounded border-slate-600 text-blue-500 bg-slate-700">
                        <span class="text-slate-200 text-sm font-medium">Add Page Numbers</span>
                    </label>
                    <label class="col-span-1 sm:col-span-2 flex items-center gap-3 cursor-pointer p-3 bg-slate-800 rounded-xl border border-slate-700 hover:border-blue-500 transition">
                        <input type="checkbox" id="opt-smart-blanks" class="w-5 h-5 rounded border-slate-600 text-blue-500 bg-slate-700">
                        <div class="flex flex-col">
                            <span class="text-slate-200 text-sm font-medium">Smart Blank Pages</span>
                            <span class="text-slate-500 text-[10px]">Fixes alignment for double-sided (50p/side) printing</span>
                        </div>
                    </label>
                </div>

                <div id="file-list" class="space-y-3">
                    </div>
            </div>

            <div class="p-6 border-t border-slate-800 bg-slate-900">
                <button onclick="executeMerge()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl shadow-lg flex justify-center items-center gap-3 text-lg transition transform active:scale-95">
                    <i class="fas fa-magic"></i> Merge & Download PDF
                </button>
            </div>
        </div>
    </div>

    <script src="common.js"></script>
    <script src="merge.js"></script>
</body>
</html>
