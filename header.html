<div class="relative sticky top-0 z-50">
    <nav class="bg-[#0b1120] backdrop-blur-md py-4 px-6 flex justify-between items-center border-b border-slate-800">
        
        <div class="cursor-pointer flex items-center gap-3" onclick="window.location.href='/'">
            <img src="/logo.jpg" alt="Shriram Stationers" class="h-10 md:h-12 object-contain rounded-md border border-slate-700">
            <span class="hidden md:block text-xl md:text-2xl font-bold tracking-tight text-white">Shriram Stationers</span>
        </div>
        
        <div class="hidden md:flex space-x-8 font-semibold text-slate-300 items-center text-sm md:text-base">
            <a href="/#home" class="hover:text-white transition">Home</a>
            <a href="/#about" class="hover:text-white transition">About Us</a>
            <a href="/pdftools" class="bg-slate-800 text-white px-5 py-2.5 rounded-lg hover:bg-slate-700 transition border border-slate-600 shadow-sm flex items-center">
                <i class="fas fa-tools text-blue-400 mr-2"></i> Free PDF Tools
            </a>
            <a href="#contact" class="hover:text-white transition">Contact</a>
        </div>
        
        <button id="mobile-menu-btn" class="md:hidden text-slate-100 hover:text-white focus:outline-none transition" aria-label="Toggle Menu">
            <i class="fas fa-bars text-3xl"></i>
        </button>
    </nav>

    <div id="mobile-menu" class="hidden md:hidden absolute top-full left-0 w-full bg-[#0b1120] border-b border-slate-800 shadow-2xl">
        <div class="flex flex-col px-6 py-6 space-y-6 text-left text-slate-300 font-semibold text-lg">
            <a href="/#home" class="hover:text-white transition block">Home</a>
            <a href="/#about" class="hover:text-white transition block">About Us</a>
            <a href="/pdftools" class="hover:text-white transition block text-blue-400">
                <i class="fas fa-tools mr-3"></i> Free PDF Tools
            </a>
            <a href="#contact" class="hover:text-white transition block">Contact Us</a>
        </div>
    </div>
</div>

<script>
    const btn = document.getElementById('mobile-menu-btn');
    const menu = document.getElementById('mobile-menu');
    const icon = btn.querySelector('i');

    btn.addEventListener('click', () => {
        // Toggle menu visibility
        menu.classList.toggle('hidden');
        
        // Swap between 'hamburger' and 'X' icons
        if (menu.classList.contains('hidden')) {
            icon.classList.remove('fa-times');
            icon.classList.add('fa-bars');
        } else {
            icon.classList.remove('fa-bars');
            icon.classList.add('fa-times');
        }
    });
</script>
